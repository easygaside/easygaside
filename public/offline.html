<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ออฟไลน์อยู่ — EasyGAS</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: "Prompt", system-ui, -apple-system, sans-serif;
         background: #f8fafc; color: #0f172a; }
  @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f1f5f9; } }
  .card { text-align: center; padding: 2rem; }
  .emoji { font-size: 3rem; }
  h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
  p { color: #64748b; font-size: 0.9rem; margin: 0 0 1.5rem; }
  button { border: 0; border-radius: 9999px; padding: 0.6rem 1.5rem; font: inherit;
           background: #10b981; color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">📡</div>
    <h1>ยังไม่มีอินเทอร์เน็ต</h1>
    <p>เชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่อีกครั้ง</p>
    <button onclick="location.reload()">ลองใหม่</button>
  </div>
</body>
</html>
